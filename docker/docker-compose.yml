#version: "3.8"

services:
  watchtower: # 用于自动更新agent镜像，若不需要请删除这部分
    command: --interval 3600 --cleanup --label-enable
    cpu_count: 1
    mem_limit: 16m
    container_name: watchtower_agent
    environment:
      - TZ=Asia/Shanghai
      - WATCHTOWER_NO_STARTUP_MESSAGE
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  agent:
    image: deepracticexs/agent:latest
    # build:
    #  context: .
    #  dockerfile: Dockerfile
    container_name: agent
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    ports:
      - "5200:5200"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - ANTHROPIC_SMALL_FAST_MODEL=${ANTHROPIC_SMALL_FAST_MODEL}
      - NODE_ENV=production
      - PORT=5200
      - PROJECT_PATH=/project
      - AUTO_RUN_PROMPT=${AUTO_RUN_PROMPT:-}
      - AUTO_RUN_SESSION_ID=${AUTO_RUN_SESSION_ID:-}
    volumes:
      # Project directory - mount your code here
      - ${PROJECT_PATH:-.}:/project
    restart: unless-stopped
